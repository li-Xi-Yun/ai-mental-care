<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人中心 - 心聆</title>
<link rel="stylesheet" href="css/common.css">
<style>
body{height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.app-nav{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;flex-shrink:0}
.app-nav .logo{font-weight:700;color:var(--primary);font-size:15px;letter-spacing:.5px;margin-right:24px}
.app-nav .nav-item{padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;color:var(--text-secondary);transition:.2s}
.app-nav .nav-item:hover{background:rgba(108,99,255,.08);color:var(--primary)}
.app-nav .nav-item.active{background:var(--primary);color:#fff;font-weight:500}
.app-nav .spacer{flex:1}
.app-nav .user-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;font-weight:600}
.app-main{flex:1;overflow-y:auto;padding:20px 24px;background:var(--bg)}
.profile-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}
.profile-side{background:var(--card);border-radius:var(--radius);padding:20px;text-align:center;border:1px solid var(--border-light);box-shadow:var(--shadow-sm);align-self:start}
.profile-side .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#8b83ff);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700}
.profile-side .name{font-size:15px;font-weight:600;margin-bottom:2px}
.profile-side .email{font-size:10px;color:var(--text-muted);margin-bottom:16px}
.profile-menu{text-align:left}
.profile-menu .menu-item{padding:9px 12px;font-size:11px;border-radius:var(--radius-xs);margin-bottom:3px;cursor:pointer;transition:.15s}
.profile-menu .menu-item:hover{background:#f5f5f5}
.profile-menu .menu-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.profile-menu .menu-item.danger{color:var(--danger)}
.profile-menu .menu-item.danger:hover{background:#fff0f0}
.profile-main{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.profile-main .section-title{font-size:15px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border-light)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:11px}
.form-item{display:flex;flex-direction:column;gap:4px}
.form-item label{color:var(--text-secondary);font-size:10px}
.form-item .field{padding:8px 10px;background:#f9f9fb;border:1px solid var(--border-light);border-radius:var(--radius-xs);font-size:11px;color:var(--text)}
.form-full{grid-column:span 2}
.gender-options{display:flex;gap:8px}
.gender-option{padding:4px 10px;border:1px solid var(--border);border-radius:4px;font-size:10px;cursor:pointer;transition:.15s}
.gender-option:hover{border-color:var(--primary)}
.gender-option.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.action-bar{margin-top:16px;display:flex;gap:8px}
</style>
</head>
<body>
<div class="app">
<div class="app-nav">
<span class="logo">心聆</span>
<span class="nav-item">首页</span>
<span class="nav-item">AI对话</span>
<span class="nav-item">心理评估</span>
<span class="nav-item">量表测评</span>
<span class="nav-item active">个人中心</span>
<span class="spacer"></span>
<div class="user-avatar">U</div>
</div>
<div class="app-main">
<div class="profile-layout">
<div class="profile-side">
<div class="avatar">U</div>
<div class="name">张小明</div>
<div class="email">xiaoming@example.com</div>
<div class="profile-menu">
<div class="menu-item active">基本信息</div>
<div class="menu-item">安全设置</div>
<div class="menu-item">消息通知</div>
<div class="menu-item">隐私设置</div>
<div class="menu-item">使用统计</div>
<div class="menu-item danger">退出登录</div>
</div>
</div>
<div class="profile-main">
<div class="section-title">基本信息</div>
<div class="form-grid">
<div class="form-item">
<label>用户名 (username)</label>
<div class="field">zhangxiaoming</div>
</div>
<div class="form-item">
<label>昵称 (username)</label>
<div class="field">张小明</div>
</div>
<div class="form-item">
<label>手机号 (phone)</label>
<div class="field">138****5678</div>
</div>
<div class="form-item">
<label>邮箱 (email)</label>
<div class="field">xiaoming@example.com</div>
</div>
<div class="form-item">
<label>性别 (gender) 0/1/2</label>
<div class="gender-options">
<span class="gender-option active">1-男</span>
<span class="gender-option">0-女</span>
<span class="gender-option">2-未知</span>
</div>
</div>
<div class="form-item">
<label>所在地 (location)</label>
<div class="field">北京市</div>
</div>
<div class="form-item form-full">
<label>头像URL (avatar) — 由 /common/upload/image 返回</label>
<div class="field">https://oss.example.com/avatars/xxx.jpg</div>
</div>
<div class="form-item form-full">
<label>个人简介 (introduction)</label>
<div class="field" style="min-height:42px;">热爱生活，关注心理健康</div>
</div>
<div class="form-item">
<label>注册时间</label>
<div class="field">2025-06-15 10:30</div>
</div>
<div class="form-item">
<label>最后登录</label>
<div class="field">2026-09-23 08:45</div>
</div>
<div class="form-item">
<label>测评次数</label>
<div class="field">15</div>
</div>
<div class="form-item">
<label>对话轮次</label>
<div class="field">86</div>
</div>
</div>
<div class="action-bar">
<span class="bp b1" style="font-size:10px;">保存修改</span>
<span class="bp b2" style="font-size:10px;">取消</span>
</div>
</div>
</div>
</div>
</div>
</body>
</html>

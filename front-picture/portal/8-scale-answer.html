<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>量表作答 - AI Mental Care</title>
<link rel="stylesheet" href="css/common.css">
<style>
body{height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.app-nav{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;flex-shrink:0}
.app-nav .logo{font-weight:700;color:var(--primary);font-size:15px;letter-spacing:.5px;margin-right:24px}
.app-nav .nav-item{padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;color:var(--text-secondary);transition:.2s}
.app-nav .nav-item:hover{background:rgba(108,99,255,.08);color:var(--primary)}
.app-nav .nav-item.active{background:var(--primary);color:#fff;font-weight:500}
.app-nav .spacer{flex:1}
.app-nav .user-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;font-weight:600}
.app-main{flex:1;overflow-y:auto;padding:20px 24px;background:var(--bg);display:flex;justify-content:center}
.answer-container{width:520px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);margin-bottom:14px}
.breadcrumb a{color:var(--primary);text-decoration:none;cursor:pointer}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .cur{color:var(--text);font-weight:500}
.question-card{background:var(--card);border-radius:var(--radius-sm);padding:28px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-header .q-title{font-size:16px;font-weight:600}
.q-header .q-progress{font-size:11px;color:var(--text-muted)}
.progress-bar{height:6px;background:#e8e8e8;border-radius:3px;margin-bottom:22px;overflow:hidden}
.progress-bar .fill{height:6px;background:var(--primary);border-radius:3px;transition:width .3s}
.q-text{font-size:14px;font-weight:600;margin-bottom:20px;line-height:1.7}
.option-list{display:flex;flex-direction:column;gap:10px}
.option-item{padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.2s}
.option-item:hover{border-color:var(--primary)}
.option-item.selected{border-color:var(--primary);background:var(--primary-light)}
.option-item .radio{width:22px;height:22px;border-radius:50%;border:2px solid #d0d0d0;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:.2s}
.option-item.selected .radio{background:var(--primary);border-color:var(--primary);color:#fff}
.option-item .radio-letter{font-size:10px;font-weight:600}
.option-item.selected .radio-letter{color:#fff}
.option-item .opt-text{flex:1}
.option-item .opt-score{font-size:11px;color:var(--text-muted)}
.option-item.selected .opt-score{color:var(--primary)}
.q-footer{display:flex;justify-content:space-between;margin-top:22px}
.submit-hint{font-size:10px;color:var(--text-muted);margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="app">
<div class="app-nav">
<span class="logo">AI Mental Care</span>
<span class="nav-item">首页</span>
<span class="nav-item">AI对话</span>
<span class="nav-item">心理评估</span>
<span class="nav-item active">量表测评</span>
<span class="nav-item">个人中心</span>
<span class="spacer"></span>
<div class="user-avatar">U</div>
</div>
<div class="app-main">
<div class="answer-container">
<div class="breadcrumb">
<a href="7-scale-list.html">量表测评</a><span>›</span><span class="cur">SAS 焦虑自评量表</span>
</div>
<div class="question-card">
<div class="q-header">
<span class="q-title">SAS 焦虑自评量表</span>
<span class="q-progress">第 5/20 题</span>
</div>
<div class="progress-bar"><div class="fill" style="width:25%;"></div></div>
<div class="q-text">5. 我觉得比平常容易紧张和着急</div>
<div class="option-list">
<div class="option-item">
<div class="radio"><span class="radio-letter">A</span></div>
<span class="opt-text">没有或很少时间</span>
<span class="opt-score">1分</span>
</div>
<div class="option-item selected">
<div class="radio"><span class="radio-letter">B</span></div>
<span class="opt-text">少部分时间</span>
<span class="opt-score">2分</span>
</div>
<div class="option-item">
<div class="radio"><span class="radio-letter">C</span></div>
<span class="opt-text">相当多时间</span>
<span class="opt-score">3分</span>
</div>
<div class="option-item">
<div class="radio"><span class="radio-letter">D</span></div>
<span class="opt-text">绝大部分或全部时间</span>
<span class="opt-score">4分</span>
</div>
</div>
<div class="q-footer">
<span class="bp b2">← 上一步</span>
<span class="bp b1">下一步 →</span>
</div>
<div class="submit-hint">
提交时传: ScaleUserAnswerDTO{scaleId, answers:[AnswerItemDTO{questionId, optionId}]}
</div>
</div>
</div>
</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人资料 - 心聆</title>
<style>:root{--primary:#6366f1;--primary-hover:#4f46e5;--primary-light:#eef2ff;--primary-subtle:#e0e7ff;--sidebar-bg:#0f172a;--sidebar-hover:rgba(255,255,255,0.06);--sidebar-active:rgba(99,102,241,0.15);--text-primary:#1e293b;--text-secondary:#64748b;--text-muted:#94a3b8;--border-color:#e2e8f0;--border-light:#f1f5f9;--bg-page:#f1f5f9;--bg-card:#ffffff;--bg-content:#f8fafc;--success:#22c55e;--success-bg:#f0fdf4;--warning:#f59e0b;--warning-bg:#fffbeb;--danger:#ef4444;--danger-bg:#fef2f2;--info:#3b82f6;--info-bg:#eff6ff;--purple:#8b5cf6;--purple-bg:#f5f3ff;--radius-sm:6px;--radius:8px;--radius-lg:12px;--shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04);--shadow-lg:0 10px 25px rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.04);--transition:0.2s ease}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-page);color:var(--text-primary);line-height:1.5;height:100vh;overflow:hidden}.al{display:flex;height:100vh}.as{width:232px;background:var(--sidebar-bg);color:#cbd5e1;padding:0;flex-shrink:0;display:flex;flex-direction:column;position:relative;overflow:hidden}.as::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 50%,rgba(99,102,241,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(99,102,241,0.04) 0%,transparent 50%);pointer-events:none}.as-header{padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.06);position:relative;z-index:1}.as-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 4px 12px rgba(99,102,241,0.3)}.as-logo svg{width:20px;height:20px}.as .alo{padding:0;font-size:15px;font-weight:700;color:#f1f5f9;margin-bottom:3px;letter-spacing:0.3px}.as .als{padding:0;font-size:11px;color:#64748b;margin-bottom:0;font-weight:400}.as-nav{flex:1;padding:10px 8px;overflow-y:auto;position:relative;z-index:1}.as .mi{padding:10px 14px;font-size:12.5px;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:var(--radius);margin-bottom:2px;transition:all var(--transition);color:#94a3b8;font-weight:500;position:relative}.as .mi svg{width:17px;height:17px;opacity:0.7;flex-shrink:0;transition:opacity var(--transition)}.as .mi:hover{background:var(--sidebar-hover);color:#e2e8f0}.as .mi:hover svg{opacity:1}.as .mi.active{background:var(--sidebar-active);color:#a5b4fc;border-left:3px solid var(--primary)}.as .mi.active svg{opacity:1;color:#a5b4fc}.as-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.15);position:relative;z-index:1;display:flex;align-items:center;gap:12px}.as-user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.3);font-size:13px;font-weight:600;color:#fff}.as-user-info{flex:1;min-width:0}.as-user-name{font-size:12.5px;font-weight:600;color:#e2e8f0;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.as-user-role{font-size:10.5px;color:#64748b}.as-logout{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition);color:#64748b;flex-shrink:0}.as-logout svg{width:15px;height:15px}.as-logout:hover{background:rgba(239,68,68,0.15);color:#f87171}.ar{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}.ah{height:48px;background:var(--bg-card);border-bottom:1px solid var(--border-color);display:flex;align-items:center;padding:0 20px;justify-content:space-between}.ah-title{font-size:14px;font-weight:600;color:var(--text-primary)}.ah-meta{font-size:11px;color:var(--text-muted)}.am{flex:1;background:var(--bg-content);padding:18px;overflow-y:auto}.bp{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:var(--radius-sm);font-size:11.5px;font-weight:500;cursor:pointer;transition:all var(--transition);white-space:nowrap;text-decoration:none}.bp svg{width:13px;height:13px}.b1{background:var(--primary);color:#fff;border:none}.b1:hover{background:var(--primary-hover);box-shadow:var(--shadow-sm)}.b2{background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary)}.b2:hover{background:#f8fafc;border-color:#cbd5e1}.inp{border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:6px 10px;font-size:11.5px;display:inline-flex;align-items:center;min-width:120px;background:var(--bg-card);color:var(--text-muted);transition:border-color var(--transition)}.inp:hover{border-color:#cbd5e1}.inp:focus-within{border-color:var(--primary);outline:none}</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">

<symbol id="icon-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></symbol>
<symbol id="icon-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
<symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="icon-brain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3c0 1.2.8 2.2 2 2.7V9H9a3 3 0 0 0-3 3v1H4a2 2 0 0 0 0 4h2v1.3c-1.2.5-2 1.5-2 2.7a3 3 0 0 0 6 0c0-1.2-.8-2.2-2-2.7V17h2a3 3 0 0 0 3-3v-1h2v1a3 3 0 0 0 3 3h2v1.3c-1.2.5-2 1.5-2 2.7a3 3 0 0 0 6 0c0-1.2-.8-2.2-2-2.7V17h2a2 2 0 0 0 0-4h-2v-1a3 3 0 0 0-3-3h-2V7.7c1.2-.5 2-1.5 2-2.7a3 3 0 0 0-6 0z"/></symbol>
<symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
<symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></symbol>
<symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</svg>

<div class="al">
<div class="as">
<div class="as-header">
<div class="as-logo"><svg><use href="#icon-brain"/></svg></div>
<div class="alo">心聆</div>
<div class="als">心理健康管理平台</div>
</div>
<div class="as-nav">
<div class="mi"><svg><use href="#icon-users"/></svg>用户管理</div>
<div class="mi"><svg><use href="#icon-shield"/></svg>管理员管理</div>
<div class="mi"><svg><use href="#icon-folder"/></svg>文件管理</div>
<div class="mi"><svg><use href="#icon-chart"/></svg>量表管理</div>
<div class="mi"><svg><use href="#icon-heart"/></svg>症状字典</div>
<div class="mi"><svg><use href="#icon-cpu"/></svg>AI节点配置</div>

<div class="mi active"><svg><use href="#icon-user"/></svg>个人资料</div>
</div>
<div class="as-user">
<div class="as-user-avatar">A</div><div class="as-user-info"><div class="as-user-name">Admin</div><div class="as-user-role">超级管理员</div></div>

</div>
</div>
<div class="ar">
<div class="ah"><span class="ah-title">个人资料</span><span class="ah-meta">管理员：admin</span></div>
<div class="am">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
<div style="background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border-color);">
<div style="font-size:14px;font-weight:600;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px;"><svg width="16" height="16" style="color:var(--primary)"><use href="#icon-user"/></svg>基本信息</div>
<div style="display:flex;flex-direction:column;gap:12px;font-size:12px;">
<div style="display:flex;align-items:center;"><span style="color:var(--text-muted);width:75px;flex-shrink:0;">用户名：</span>admin</div>
<div style="display:flex;align-items:center;"><span style="color:var(--text-muted);width:75px;flex-shrink:0;">邮箱：</span><span class="inp" style="min-width:160px;color:var(--text-muted)">admin@example.com</span></div>
<div style="display:flex;align-items:center;"><span style="color:var(--text-muted);width:75px;flex-shrink:0;">手机号：</span><span class="inp" style="min-width:160px;color:var(--text-muted)">138****0001</span></div>
<div style="margin-top:4px;"><span class="bp b1"><svg><use href="#icon-save"/></svg>保存修改</span></div>
</div>
</div>
<div style="background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border-color);">
<div style="font-size:14px;font-weight:600;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px;"><svg width="16" height="16" style="color:var(--warning)"><use href="#icon-lock"/></svg>修改密码</div>
<div style="display:flex;flex-direction:column;gap:12px;font-size:12px;">
<div style="display:flex;align-items:center;"><span style="color:var(--text-muted);width:80px;flex-shrink:0;">当前密码：</span><span class="inp" style="min-width:160px;color:var(--text-muted)">请输入当前密码</span></div>
<div style="display:flex;align-items:center;"><span style="color:var(--text-muted);width:80px;flex-shrink:0;">新密码：</span><span class="inp" style="min-width:160px;color:var(--text-muted)">请输入新密码</span></div>
<div style="display:flex;align-items:center;"><span style="color:var(--text-muted);width:80px;flex-shrink:0;">确认密码：</span><span class="inp" style="min-width:160px;color:var(--text-muted)">请再次输入新密码</span></div>
<div style="margin-top:4px;"><span class="bp b1">修改密码</span></div>
</div>
</div>
</div>
</div>
</div>
</div>

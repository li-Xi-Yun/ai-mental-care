<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理员登录 - AI Mental Care</title>
<style>
:root {
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-light: #eef2ff;
  --primary-subtle: #e0e7ff;
  --sidebar-bg: #0f172a;
  --sidebar-hover: rgba(255,255,255,0.06);
  --sidebar-active: rgba(99,102,241,0.15);
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border-color: #e2e8f0;
  --border-light: #f1f5f9;
  --bg-page: #f1f5f9;
  --bg-card: #ffffff;
  --bg-content: #f8fafc;
  --success: #22c55e;
  --success-bg: #f0fdf4;
  --warning: #f59e0b;
  --warning-bg: #fffbeb;
  --danger: #ef4444;
  --danger-bg: #fef2f2;
  --info: #3b82f6;
  --info-bg: #eff6ff;
  --purple: #8b5cf6;
  --purple-bg: #f5f3ff;
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.04);
  --transition: 0.2s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#1e293b,#334155);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;line-height:1.5}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11.5px;color:var(--text-secondary);margin-bottom:5px;font-weight:500}
.form-input{border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:8px 12px;font-size:11.5px;width:100%;transition:border-color var(--transition);color:var(--text-muted);background:var(--bg-card)}
.form-input:focus{border-color:var(--primary);outline:none;color:var(--text-primary)}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
</svg>

<div style="background:#fff;border-radius:var(--radius-lg);padding:36px;width:340px;box-shadow:0 16px 48px rgba(0,0,0,.2);">
<div style="text-align:center;margin-bottom:24px;">
<div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 4px 12px rgba(99,102,241,.3);">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3c0 1.2.8 2.2 2 2.7V9H9a3 3 0 0 0-3 3v1H4a2 2 0 0 0 0 4h2v1.3c-1.2.5-2 1.5-2 2.7a3 3 0 0 0 6 0c0-1.2-.8-2.2-2-2.7V17h2a3 3 0 0 0 3-3v-1h2v1a3 3 0 0 0 3 3h2v1.3c-1.2.5-2 1.5-2 2.7a3 3 0 0 0 6 0c0-1.2-.8-2.2-2-2.7V17h2a2 2 0 0 0 0-4h-2v-1a3 3 0 0 0-3-3h-2V7.7c1.2-.5 2-1.5 2-2.7a3 3 0 0 0-6 0z"/></svg>
</div>
<div style="font-size:18px;font-weight:700;color:var(--text-primary);">管理后台</div>
<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">AI Mental Care 管理系统</div>
</div>
<div class="form-group">
<label class="form-label">管理员账号</label>
<div class="form-input" style="display:flex;align-items:center;gap:8px;">
<svg width="14" height="14"><use href="#icon-user"/></svg>
请输入管理员账号
</div>
</div>
<div class="form-group">
<label class="form-label">密码</label>
<div class="form-input" style="display:flex;align-items:center;gap:8px;">
<svg width="14" height="14"><use href="#icon-lock"/></svg>
请输入密码
</div>
</div>
<div class="form-group">
<label class="form-label">验证码</label>
<div style="display:flex;gap:8px;align-items:center;">
<div class="form-input" style="flex:1;display:flex;align-items:center;gap:8px;">
<svg width="14" height="14"><use href="#icon-check"/></svg>
请输入验证码
</div>
<div style="width:80px;height:32px;background:#f1f5f9;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--primary);letter-spacing:3px;cursor:pointer;border:1px solid var(--border-color);">AB3X</div>
</div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:11px;">
<label style="color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:4px;"><input type="checkbox" checked style="accent-color:var(--primary)"/> 记住我</label>
</div>
<div style="width:100%;padding:11px;background:var(--primary);color:#fff;border-radius:var(--radius);font-size:13px;text-align:center;margin-top:14px;font-weight:600;cursor:pointer;transition:background var(--transition);">登 录</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI语音对话测试</title>
  <link rel="stylesheet" href="audio-style.css">
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a class="back-btn" href="index.html">← 返回</a>
    <span class="title">AI语音对话测试</span>
  </div>
  <div class="header-right">
    <button class="interrupt-btn" id="interruptBtn">中断对话</button>
    <label class="toggle-label" title="自动测试：AI回复完成后自动请求测试接口">
      <span class="toggle-text">自动测试</span>
      <input type="checkbox" class="toggle-input" id="autoTestToggle">
      <span class="toggle-slider"></span>
    </label>
    <label class="toggle-label" title="播放模拟语音：自动测试时用浏览器朗读生成的文本">
      <span class="toggle-text">模拟语音</span>
      <input type="checkbox" class="toggle-input" id="simulatedVoiceToggle">
      <span class="toggle-slider"></span>
    </label>
    <span class="status" id="wsStatus">未连接</span>
  </div>
</div>

<div class="main-layout">
  <div class="chat-area">
    <div class="chat-container" id="chatContainer">
      <div class="message system">正在连接WebSocket...</div>
    </div>

    <div class="control-area">
      <div class="record-status-text" id="recordStatus">点击开始录音</div>
      <div class="volume-meter">
        <div class="volume-bar" id="volumeBar"></div>
      </div>
      <div class="text-input-row">
        <input type="text" class="text-input" id="textInput" placeholder="输入文字消息发送..." disabled>
        <button class="send-text-btn" id="sendTextBtn" disabled>发送</button>
      </div>
      <button class="record-btn" id="recordBtn" disabled>
        <span id="recordBtnText">🎤</span>
      </button>
      <div class="record-hint">按空格键录音 / 回车键发送文本</div>
    </div>
  </div>
</div>

<script src="bigint.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="websocket.js"></script>
<script src="utils.js"></script>
<script src="app-state.js"></script>
<script src="audio-recorder.js"></script>
<script src="audio-websocket.js"></script>
<script src="audio-chat.js"></script>
<script>
  (async function init() {
    try {
      await AppState.ws.connect();
    } catch (error) {
      AppState.fn.addSystemMessage(`WebSocket连接失败: ${error.message}`);
    }
  })();
</script>

</body>
</html>

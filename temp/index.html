<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI文本对话测试</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;">
    <button class="panel-toggle-btn" id="panelToggleBtn">会话列表</button>
    <span>AI文本对话测试</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <a class="auto-dialog-btn" id="voiceConversationLink" href="audio-conversation.html" style="text-decoration:none;">🎤 语音对话</a>
    <button class="auto-dialog-btn" id="autoDialogBtn">自动对话</button>
    <button class="emotion-toggle-btn" id="emotionToggleBtn" disabled>情绪分析</button>
    <span class="status" id="wsStatus">未连接</span>
  </div>
</div>

<div class="main-layout">
  <div class="left-panel" id="leftPanel">
    <div class="left-panel-header">
      <div class="left-panel-title-row">
        <span class="left-panel-title">会话列表</span>
        <button class="new-conversation-btn" id="newConversationBtn">新建会话</button>
      </div>
      <input type="text" class="conversation-search" id="conversationSearch" placeholder="搜索会话...">
    </div>
    <div class="left-panel-list" id="conversationList">
      <div class="sidebar-empty">加载中...</div>
    </div>
    <div class="left-panel-pagination" id="convPagination" style="display:none;">
      <button id="convPrevBtn">上一页</button>
      <span id="convPageInfo">1 / 1</span>
      <button id="convNextBtn">下一页</button>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-container" id="chatContainer"></div>
    <div class="input-area">
      <textarea id="messageInput" rows="2" placeholder="输入消息..."></textarea>
      <button id="sendBtn" disabled>发送</button>
    </div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- 语音对话：输入/输出方式选择弹窗 -->
<div class="voice-mode-overlay" id="voiceModeOverlay">
  <div class="voice-mode-dialog">
    <div class="voice-mode-title">选择语音对话方式</div>
    <div class="voice-mode-group">
      <div class="voice-mode-label">输入方式</div>
      <label class="voice-mode-option">
        <input type="checkbox" data-group="input" value="AUDIO" checked>
        <span>🎤 语音输入（麦克风）</span>
      </label>
      <label class="voice-mode-option">
        <input type="checkbox" data-group="input" value="TEXT" checked>
        <span>⌨️ 文字输入</span>
      </label>
    </div>
    <div class="voice-mode-group">
      <div class="voice-mode-label">输出方式</div>
      <label class="voice-mode-option">
        <input type="checkbox" data-group="output" value="AUDIO" checked>
        <span>🔊 语音播放</span>
      </label>
      <label class="voice-mode-option">
        <input type="checkbox" data-group="output" value="TEXT" checked>
        <span>📝 文字回复</span>
      </label>
    </div>
    <div class="voice-mode-hint">请至少选择一种输入与输出方式</div>
    <div class="voice-mode-actions">
      <button class="voice-mode-btn cancel" id="voiceModeCancelBtn">取消</button>
      <button class="voice-mode-btn confirm" id="voiceModeConfirmBtn">进入语音对话</button>
    </div>
  </div>
</div>

<div class="emotion-sidebar" id="emotionSidebar">
  <div class="sidebar-header">
    <h3>情绪分析数据</h3>
    <button class="sidebar-close-btn" id="sidebarCloseBtn">&times;</button>
  </div>
  <button class="sidebar-diagnosis-btn" id="diagnosisPageBtn" disabled>查看评估诊断结果</button>
  <div class="sidebar-content" id="sidebarContent">
    <div class="sidebar-empty">暂无会话，请先开始对话</div>
  </div>
  <div class="sidebar-pagination" id="sidebarPagination" style="display:none;">
    <button id="sidebarPrevBtn">上一页</button>
    <span id="sidebarPageInfo">1 / 1</span>
    <button id="sidebarNextBtn">下一页</button>
  </div>
</div>

<script src="bigint.js"></script>
<script src="config.js"></script>
<script src="logger/log-level.js"></script>
<script src="logger/console-appender.js"></script>
<script src="logger/indexeddb-appender.js"></script>
<script src="logger/remote-uploader.js"></script>
<script src="logger/logger.js"></script>
<script src="logger-init.js"></script>
<script src="api.js"></script>
<script src="websocket.js"></script>
<script src="utils.js"></script>
<script src="app-state.js"></script>
<script src="chat.js"></script>
<script src="auto-dialog.js"></script>
<script src="conversation-list.js"></script>
<script src="emotion-sidebar.js"></script>
<script src="app-init.js"></script>

</body>
</html>

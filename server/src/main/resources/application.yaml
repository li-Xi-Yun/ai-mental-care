mybatis:
  mapper-locations: classpath:mapper/**.xml
  type-aliases-package: ${mybatis-package}
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  config: classpath:logback-plus.xml


# Swagger3 / SpringDoc 基本配置 (OpenAPI 规范)
springdoc:
  api-docs:
    path: ${springdoc.api-docs.path} # 默认即为 /v3/api-docs，可自定义
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui/index.html # Swagger UI 的访问路径
    tags-sorter: alpha # 接口排序依据，alpha:按字母，method:按方法
    operations-sorter: alpha # 接口排序依据，alpha:按字母，method:按方法
    display-request-duration: true  # 是否在 "Try it out" 后显示接口请求的耗时（单位：毫秒）。
    default-model-expand-depth: 10  # 默认展开的模型深度。
    default-models-expand-depth: 10
    deep-linking: true
  group-configs: # 分组配置（可选）
    - group: ${springdoc.group} # 分组名
      paths-to-match: '/**' # 要匹配的路径
      packages-to-scan: ${springdoc.packages-to-scan} # 要扫描的包

# Knife4j 增强配置
knife4j:
  enable: false # 开启 Knife4j 增强功能
  setting:
    language: zh_cn # 界面语言，简体中文
    enable-swagger-models: true # 是否显示模型
    swagger-model-name: ${knife4j.setting.swagger-model-name}
    enable-document-manage: true # 是否开启文档管理
    enable-request-cache: true # 是否开启请求缓存
    enable-filter-multipart-apis: false # 是否过滤Multipart类型接口
    enable-filter-multipart-api-method-type: POST # 过滤的Multipart请求类型
  production: ${knife4j.production} # 生产环境是否屏蔽（true则禁止访问）
  basic: # 开启基础认证（可选，按需配置）
    enable: false # 是否开启基础认证
    username: admin # 用户名
    password: 123456 # 密码


jwt:
  # 设置jwt签名加密时使用的秘钥
  user-secret-key: lixiyun-hearawerjhawerhyawueT%
  # 设置jwt过期时间,两小时(秒)
  user-ttl: 7200000
  # 设置前端传递过来的令牌名称
  user-token-name: financial-basic-token

basic:
  url: http://localhost:8088

file-url:
  upload:
    images: "images/"
    videos: "videos/"
    files: "files/"
    conversations: "conversations/"
  request:
    images: "${basic.url}/images/"
    videos: "${basic.url}/videos/"
    files: "${basic.url}/files/"
    conversations: "${basic.url}/conversations/"

url:
  permit-all-urls:
    - /user/account/register
    - /user/account/login/**
    - /common/**
    - /user/account/forgetPassword
    - /v3/**
    - /webjars/**
    - /doc.html
    - /oauth2/authorization/**
    - /login/oauth2/code/**
    - /images/**
    - ${basic.url}/images/**
    - ${basic.url}/files/**
    - ${basic.url}/conversations/**
    - /swagger-ui/**
    - /swagger-ui.html/**

--- # sms 短信
sms:
  enabled: false
  # 阿里云 dysmsapi.aliyuncs.com
  # 腾讯云 sms.tencentcloudapi.com
  endpoint: "dysmsapi.aliyuncs.com"
  accessKeyId: xxxxxxx
  accessKeySecret: xxxxxx
  signName: 测试
  # 腾讯专用
  sdkAppId:


# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/v3/api-docs/**,/doc.html,/swagger-ui/**,/swagger-ui.html,/swagger-resources/**,/webjars/**,/druid/**,/actuator/**,/favicon.ico
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 全局线程池相关配置
thread-pool:
  # 是否开启线程池
  enabled: true
  # 队列最大长度
  queueCapacity: 128
  # 线程池维护线程所允许的空闲时间
  keepAliveSeconds: 300

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        # 暴露所有可用的 Actuator 端点
        include: '*'
  endpoint:
    health:
      # 总是显示健康检查的详细信息
      show-details: ALWAYS
    logfile:
      # 使得 /actuator/logfile 端点能够读取并返回指定的日志文件内容。
      # 通过这个端点，可以在线查看应用的日志文件，而不需要登录服务器查看文件系统
      external-file: ./logs/sys-console.log

# websocket
websocket:
  enabled: true
  # 路径
  path: '/resource/websocket'
  # 设置访问源地址
  allowedOrigins: '*'


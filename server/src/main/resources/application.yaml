# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8088
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256


spring:
  application:
    name: ai-mental-care
  servlet:
    multipart:
      max-file-size: 100MB  # 单个文件最大限制
      max-request-size: 200MB  # 整个请求的最大限制（适用于多文件上传）
  profiles:
    active: @profiles.active@
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: ${db.p6spy.enabled:localhost}
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${db.host:localhost}:${db.port:3306}/${db.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=GMT
          username: ${db.username}
          password: ${db.password}
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 连接测试query（配置检测连接是否有效）
        connectionTestQuery: SELECT 1
        # 多久检查一次连接的活性
        keepaliveTime: 30000
  data:
    redis:
      host: ${redis.host} # Redis服务器地址
      port: ${redis.port} # Redis服务器端口
#      password: ${redis.password}
      database: ${redis.database}
      timeout: 60000ms  # 超时时间
      lettuce:
        pool:
          # 允许最大连接数，默认8（负值表示没有限制），推荐值：大于cpu * 2，通常为(cpu * 2) + 2
          max-active: 10
          # 最大空闲连接数，默认8，推荐值：cpu * 2
          max-idle: 8
          # 最小空闲连接数，默认0，推荐值：0
          min-idle: 0
          # 连接用完时，新的请求等待的时间（s秒，ms毫秒），超过该时间抛出异常，默认-1（负值表示没有限制）
          max-wait: 5s
  mail:
    host: ${mail.host}  # 设置邮件服务器的主机地址，这里使用的是QQ邮箱的SMTP服务器
    port: ${mail.port}  # 设置邮件服务器的端口号，465是QQ邮箱SSL加密协议使用的端口
    username: ${mail.username}  # 发送邮件的QQ邮箱账号
    password: ${mail.password}  # QQ邮箱的SMTP授权码，需在QQ邮箱中开启SMTP服务后获取，非邮箱登录密码
    default-encoding: UTF-8  # 设置邮件发送时内容的默认编码格式为UTF-8，确保支持中文等字符集
    properties:
      mail:
        smtp:
          auth: false  # 禁用SMTP身份验证，发送邮件时将不进行身份验证，这会带来安全风险，可能导致他人滥用邮件服务发送垃圾邮件或恶意邮件。
          ssl:
            enable: true  # 启用SSL加密传输，提高邮件传输安全性
          starttls:
            enable: true  # 启用STARTTLS加密机制，使连接升级为加密连接
            required: true  # 要求必须使用STARTTLS加密，否则连接失败
  security:
    oauth2:
      client:
        registration: # 定义OAuth2客户端注册信息
          github:
            client-id: ${oauth2.client.registration.github.client-id}
            client-secret: ${oauth2.client.registration.github.client-secret}
            scope: ${oauth2.client.registration.github.scope}
            redirect-uri: ${oauth2.client.registration.github.redirect-uri}
  ai:
    chat:
      client:
        enabled: false   # 禁用 ChatClient.Builder bean 的自动配置
        observations:
          log-prompt: true
      memory:
        repository:
          # 用于存储聊天记忆的组件，关系型数据库(三选一)
          jdbc:
            initialize-schema: never  # 控制何时初始化架构。值：embedded (default), always, never.
#    vectorstore:
#      # 示例：Milvus向量库配置

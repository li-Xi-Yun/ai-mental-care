#        embedding-dimension: 1024     # 要存储在 Milvus 集合中的向量的维度。
#        index-type: IVF_FLAT          # 要为 Milvus 集合创建的索引类型。
#        metric-type: COSINE           # 要用于 Milvus 集合的指标类型。
#        index-parameters: {“nlist”：1024}  # 要用于 Milvus 集合的索引参数。
#        id-field-name: id    # 集合的 ID 字段名称
#        auto-id: true        # 布尔标志，指示是否将自动 ID 用于 ID 字段
#        content-field-name: ${milvus.content-field-name}      # 集合的内容字段名称
#        metadata-field-name: ${milvus.metadata-field-name}    # 集合的元数据字段名称
#        embedding-field-name: ${milvus.embedding-field-name}  # 集合的嵌入字段名称
#        client:
#          host: ${milvus.host}    # 主机的名称或地址
#          port: ${milvus.port}        # 连接端口。
#          username: ${milvus.username}     # 此连接的用户名。
#          password: ${milvus.password}   # 此连接的密码。
#          #          uri:        # Milvus 实例的 uri
#          #          token:      #令牌作为识别和身份验证目的的密钥。
#          connect-timeout-ms: 10000    # 客户端通道的连接超时值。超时值必须大于零。
#          keep-alive-time-ms: 55000    # 客户端通道的保持活动时间值。keep-alive 值必须大于零。
